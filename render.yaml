# Static site (React + Vite). Connect repo College-review-system-frontend on Render.
# Backend API (also set in Render dashboard when deploying the static site)

services:
  - type: web
    name: college-review-system-frontend
    runtime: static
    buildCommand: npm run render-build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-review-system-backend-4qtm.onrender.com
