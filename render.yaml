# Deploy as a Static Site on Render (recommended).
# Dashboard: New → Static Site → connect this repo, or apply this Blueprint.

services:
  - type: web
    name: college-review-system-frontend
    runtime: static
    # Works even if Dashboard Build Command is only `npm install` (postinstall builds on Render).
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        value: https://college-review-system-backend-4qtm.onrender.com
