# Static site (React + Vite). Connect repo College-review-system-frontend on Render.
# Set VITE_API_URL to your backend URL, e.g. https://college-review-system-api.onrender.com

services:
  - type: web
    name: college-review-system-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
